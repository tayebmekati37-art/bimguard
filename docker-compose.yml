services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bimguard
      POSTGRES_PASSWORD: bimguard
      POSTGRES_DB: bimguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bimguard"]
      interval: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bimguard:bimguard@db:5432/bimguard
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  pgdata:
