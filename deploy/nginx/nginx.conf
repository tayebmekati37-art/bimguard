# BIMGuard reverse proxy (nginx).
#
# Two rate limit tiers:
#   login  — /auth/login only. Strict. Catches brute-force attempts.
#   api    — everything else. Looser. Safety valve for runaway clients.
# /health is not rate limited so monitoring and load balancers work.
#
# X-Forwarded-For is REPLACED with $remote_addr, not appended. The app
# (apps/api/app/services/rate_limit.py:get_client_ip) takes the first
# entry of X-Forwarded-For, so appending would let a client spoof their
# IP by sending "X-Forwarded-For: 9.9.9.9". Replacing ensures the app
# sees the IP nginx actually accepted the connection from.
#
# If nginx itself is behind a CDN or another load balancer, uncomment
# the real_ip block below and list the CDN's ranges. That makes
# $remote_addr resolve to the original client IP.

# Rate limit zones. 10m memory holds ~160k unique IPs per zone.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# --- real IP passthrough (only if behind another trusted proxy) ---
# set_real_ip_from 10.0.0.0/8;
# set_real_ip_from 172.16.0.0/12;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

upstream bimguard_api {
    server api:8000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;

    # Health still answers on HTTP for legacy monitors that expect it.
    location = /health {
        access_log off;
        proxy_pass http://bimguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Slightly above MAX_UPLOAD_MB (50) to allow multipart overhead.
    client_max_body_size 60M;
    client_body_timeout 60s;

    # One client should not open more than 20 concurrent connections.
    limit_conn conn 20;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Common proxy headers, repeated in each block for clarity.
    # Note: X-Forwarded-For REPLACES (not appends) so the app sees the
    # actual client IP as the first entry. See file header.

    location = /health {
        access_log off;
        proxy_pass http://bimguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    location = /auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        proxy_pass http://bimguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        proxy_pass http://bimguard_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # long: PDFs, comparisons, impacts
        proxy_send_timeout 300s;
    }
}